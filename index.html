    * {

    .blob {
      position: absolute;
      width: 760px;
      height: 480px;
      transition: filter 0.3s ease-out;
      cursor: pointer;
      will-change: transform;
      opacity: 1;
      animation: fadeIn 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: blur(2.5px);
      transform-origin: center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    .blob::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: inherit;
      filter: blur(0);
      opacity: 0;
      transition: all 0.3s ease-out;
    }

    @keyframes fadeIn {

    .text-container {

    }

    h1 {
      font-size: 8.25rem;
      font-weight: 600;

      color: #222;
      letter-spacing: 0.02em;

    }

    p {

      margin-top: 1.2rem;
      margin-bottom: 1.2rem;

      color: #666;
      text-transform: lowercase;
    }

    .gradient-text {
      background: linear-gradient(45deg, #FF6060, #60D880, #60A8FF, #B898D8, #FFC060, #A898FF, #60E8C0, #FF98B8);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradient 12s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .floating-text {
      position: fixed;
      font-family: 'Comfortaa', sans-serif;
      font-size: 1.2rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 9999;
      padding: 0.8rem 1.2rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 0.8rem;
      text-align: center;
      width: auto;
      min-width: 90px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
      transform: translate(-50%, -50%);
    }

    .floating-text span {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      animation: typing 1.5s steps(40, end) forwards;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .blob-container {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .text-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .hover-text-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    .blob:hover {
      filter: blur(1px);
    }

    .blob:active {
      transform: scale(0.98);
    }

    .custom-cursor {
      position: fixed;
      width: 25px;
      height: 25px;
      pointer-events: none;
      z-index: 9999;
    }

    .sparkle {
      position: absolute;
      width: 20px;
      height: 20px;
      background: linear-gradient(45deg, #FF6060, #60D880, #60A8FF, #B898D8, #FFC060, #A898FF, #60E8C0, #FF98B8);
      background-size: 400% 400%;
      clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
      animation: sparkle 2.5s ease-in-out infinite, gradient 12s ease infinite;
      opacity: 1;
      filter: blur(0.8px);
    }

    .custom-cursor {
      position: fixed;
      width: 25px;
      height: 25px;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes sparkle {
      0% {
        transform: scale(0.9) translate(-50%, -50%) rotate(0deg);

      }
      100% {

</head>
<body>

  <div class="app">

      <div class="blob" style="background: linear-gradient(45deg, #FF8888, #FFA0A0, #FFB8B8, #FFD0D0, #FFE8E8, #FFF0F0, #FFB0B0); filter: blur(2px); box-shadow: 0 0 8px 4px rgba(255, 136, 136, 0.5);" data-text="what if no one likes me?" data-color="#FF8888"></div>

      <h1>beani</h1>
      <p>heal your <span class="gradient-text">inner child</span></p>

  <script>
    class Blob {
      constructor(element, index) {
        this.element = element;
        const totalBlobs = 11;
        const radius = Math.min(window.innerWidth, window.innerHeight) * 0.4;
        const angle = ((index / totalBlobs) * Math.PI * 2) + (Math.random() * 0.5);
        
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        
        const radiusVariation = radius * (0.3 + Math.random() * 0.7);
        
        this.x = centerX + Math.cos(angle) * radiusVariation - 400;
        this.y = centerY + Math.sin(angle) * radiusVariation - 240;
        
        const randomOffset = 400;
        this.x += (Math.random() - 0.5) * randomOffset;
        this.y += (Math.random() - 0.5) * randomOffset;
        
        this.vx = 0;
        this.vy = 0;
        
        this.baseRotation = (angle * 180 / Math.PI) + 90;
        this.rotation = this.baseRotation;
        this.baseY = this.y;
        
        this.floatOffset = Math.random() * Math.PI * 2;
        this.floatAmplitude = 120 + Math.random() * 80;
        this.floatSpeed = 0.008 + Math.random() * 0.02;
        
        this.horizontalFloatOffset = Math.random() * Math.PI * 2;
        this.horizontalFloatAmplitude = 10 + Math.random() * 10;
        this.horizontalFloatSpeed = 0.002 + Math.random() * 0.005;
        
        this.tiltSpeed = 0.002 + Math.random() * 0.005;
        this.tiltAmplitude = 0.3 + Math.random() * 0.4;
        this.tiltOffset = Math.random() * Math.PI * 2;
        
        this.scale = 0.4 + Math.random() * 0.2;
        
        this.textElement = element.querySelector('.hover-text');
        
        this.updatePosition();
      }

      updatePosition() {
        this.element.style.left = `${this.x}px`;
        this.element.style.top = `${this.y}px`;
        this.element.style.transform = `rotate(${this.rotation}deg) scale(${this.scale})`;
        this.element.style.opacity = '1';
        
        if (this.textElement) {
          const rect = this.element.getBoundingClientRect();
          this.textElement.style.left = `${rect.left + rect.width + 20}px`;
          this.textElement.style.top = `${rect.top + rect.height / 2}px`;
        }
      }

      move() {
        const time = Date.now() / 4000;
        
        this.y = this.baseY + Math.sin(time * this.floatSpeed + this.floatOffset) * this.floatAmplitude;
        
        this.x += Math.sin(time * this.horizontalFloatSpeed + this.horizontalFloatOffset) * 0.1;
        
        const tilt = Math.sin(time * this.tiltSpeed + this.tiltOffset) * this.tiltAmplitude;
        this.rotation = this.baseRotation + tilt;
        
        this.updatePosition();
      }
    }

    const blobs = Array.from(document.querySelectorAll('.blob')).map((el, index) => new Blob(el, index));

    function checkCollisions() {
      for (let i = 0; i < blobs.length; i++) {
        for (let j = i + 1; j < blobs.length; j++) {
          const dx = blobs[i].x - blobs[j].x;
          const dy = blobs[i].y - blobs[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 400) {
            const nx = dx / distance;
            const ny = dy / distance;

            const relativeVelocityX = blobs[i].vx - blobs[j].vx;
            const relativeVelocityY = blobs[i].vy - blobs[j].vy;

            const impulse = 0.004 * (relativeVelocityX * nx + relativeVelocityY * ny) / 2;

            blobs[i].vx -= impulse * nx * 0.1;
            blobs[i].vy -= impulse * ny * 0.1;
            blobs[j].vx += impulse * nx * 0.1;
            blobs[j].vy += impulse * ny * 0.1;

            const overlap = (400 - distance) * 1.1;
            const separationForce = 0.08;
            
            blobs[i].x += nx * overlap * separationForce;
            blobs[i].y += ny * overlap * separationForce;
            blobs[j].x -= nx * overlap * separationForce;
            blobs[j].y -= ny * overlap * separationForce;

            const rotationAmount = 0.08;
            blobs[i].rotation += (Math.random() - 0.5) * rotationAmount;
            blobs[j].rotation += (Math.random() - 0.5) * rotationAmount;
          }
        }
      }
    }

    function animate() {
      blobs.forEach(blob => blob.move());
      checkCollisions();
      requestAnimationFrame(animate);
    }

    setTimeout(() => {
      animate();
    }, 100);

    const floatingText = document.querySelector('.floating-text');
    const blobElements = document.querySelectorAll('.blob');
    const customCursor = document.querySelector('.custom-cursor');
    let lastX = 0;
    let lastY = 0;

    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = `${e.clientX - 15}px`;
      customCursor.style.top = `${e.clientY - 15}px`;
    });

    blobElements.forEach(blob => {
      blob.addEventListener('mouseenter', (e) => {
        const text = blob.dataset.text;
        const color = blob.dataset.color;
        floatingText.style.color = color;
        floatingText.innerHTML = `<span>${text}</span>`;
        floatingText.style.opacity = '1';
      });

      blob.addEventListener('mousemove', (e) => {
        floatingText.style.left = `${e.clientX + 20}px`;
        floatingText.style.top = `${e.clientY}px`;
      });

      blob.addEventListener('mouseleave', () => {
        floatingText.style.opacity = '0';
      });
    });
  </script>
